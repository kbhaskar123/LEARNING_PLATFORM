<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LearnHub - Register</title>
<link rel="stylesheet" href="../css/main.css" />

<!-- Extra styling for register page -->
<style>
/* Center layout */
.page-wrap {
  min-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

/* Register card */
.register-card {
  width: 450px;
  max-width: calc(100% - 40px);
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 14px 40px rgba(20,40,80,0.10);
  animation: fadePop .35s ease-out;
  text-align: center;
}

/* Title */
.register-card h2 {
  color: #2f80ed;
  font-size: 28px;
  margin-bottom: 20px;
  font-weight: 700;
}

/* Inputs */
#registerForm {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

#registerForm input,
#registerForm select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #d7e4ef;
  font-size: 16px;
  outline: none;
  background: #fff;
  transition: 0.25s;
}

#registerForm input:focus,
#registerForm select:focus {
  border-color: #2f80ed;
  box-shadow: 0 0 10px rgba(47,128,237,0.18);
}

/* Register button */
.button {
  background: linear-gradient(180deg,#2f80ed,#1b63d6);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.25s;
}

.button:hover {
  box-shadow: 0 10px 22px rgba(47,128,237,0.18);
}

/* Messages */
.error { color: #d64545; margin-top: 10px; }
.success { color: green; margin-top: 10px; }

/* fade pop animation */
@keyframes fadePop {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>

<script src="../js/auth.js" defer></script>
</head>

<body>

<!-- Navbar -->
<header class="navbar">
  <div class="logo">LearnHub</div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<!-- Central Register Card -->
<div class="page-wrap">
  <div class="register-card">

    <h2>Create an Account</h2>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />

      <select id="role" required>
        <option value="student" selected>Student</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" class="button">Register</button>
    </form>

    <p id="registerError" class="error"></p>
    <p id="registerSuccess" class="success"></p>

  </div>
</div>

</body>
</html>
